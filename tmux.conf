# tmux config for `hq team` — loaded only by hq's own tmux server
# (socket "hq"), never by any other tmux you run.

# Full colour and modern keys, so Claude Code looks and types as it does
# straight in iTerm (Shift+Enter for a new line included).
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB:extkeys"
set -g extended-keys on
set -s escape-time 10
set -g focus-events on

# Alerts reach iTerm: bells and "waiting for input" notifications.
set -g allow-passthrough on
set -g bell-action any
set -g visual-bell off

# Windows are named "<agent> · <where>" by bin/team; the terminal title follows.
set -g allow-rename off
set -g automatic-rename off
set -g set-titles on
set -g set-titles-string "#W"

# Plain-terminal use (outside iTerm's integration): mouse scrolling,
# click to switch windows, a long scrollback, windows numbered from 1.
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
